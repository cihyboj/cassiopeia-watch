name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: |
          if [ ! -f app/lint-baseline.xml ]; then
            # First run writes the baseline and aborts; the follow-up run gates on it.
            ./gradlew lint --stacktrace || true
          fi
          ./gradlew lint --stacktrace

      - name: Commit newly generated lint baseline
        if: github.event_name == 'push'
        run: |
          # Until the baseline is committed, it is regenerated per-run and cannot catch
          # NEW lint errors — so persist it to the branch the first time it appears.
          if [ -f app/lint-baseline.xml ] && ! git ls-files --error-unmatch app/lint-baseline.xml >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/lint-baseline.xml
            git commit -m "Add generated lint baseline [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload lint baseline and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint
          path: |
            app/lint-baseline.xml
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Unsigned; exercises R8 minification so broken keep rules fail CI instead of
      # shipping a silently broken release.
      - name: Build release APK (R8 check)
        run: ./gradlew assembleRelease --stacktrace
