name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: |
          if [ ! -f app/lint-baseline.xml ]; then
            # First run writes the baseline and aborts; the follow-up run gates on it.
            ./gradlew lint --stacktrace || true
          fi
          ./gradlew lint --stacktrace

      - name: Upload lint baseline and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint
          path: |
            app/lint-baseline.xml
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Unsigned; exercises R8 minification so broken keep rules fail CI instead of
      # shipping a silently broken release.
      - name: Build release APK (R8 check)
        run: ./gradlew assembleRelease --stacktrace
